name: Bug report
description: Something in Folio Motion behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, do not open a public issue.
        Follow SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: Dragging damping below 8 should report a bouncy band, but the score stays at 100.
    validations:
      required: true

  - type: textarea
    id: params
    attributes:
      label: Motion parameters (if engine-related)
      description: A spec is reproducible from these alone. Paste them as JSON.
      render: json
      placeholder: |
        { "kind": "spring", "stiffness": 320, "damping": 30, "mass": 1, "displacement": 100 }
    validations:
      required: false

  - type: input
    id: route
    attributes:
      label: Route
      placeholder: /lab
    validations:
      required: false

  - type: input
    id: engine-version
    attributes:
      label: Engine version
      description: Shown on /method and in the footer.
      placeholder: 2026.2.0
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Only if there was an error. No sensitive data, please.
      render: shell
    validations:
      required: false
