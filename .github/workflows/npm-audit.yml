name: Dependency audit

# A weekly `npm audit` sweep.
#
# The CI gate on the pull request workflow fails the build on a critical
# advisory and reports the rest. This one closes the loop: it runs on a
# schedule, applies the fixes npm can apply without changing any dependency
# range, and opens a pull request with them so a human reviews the bump
# instead of discovering it in a production incident.

on:
  schedule:
    # Mondays at 06:17 UTC. Not on the hour, so it does not queue behind every
    # other scheduled workflow on the planet.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect the advisories
        # npm audit exits non-zero when it finds anything, which is not an
        # error here: the report is what this step is after.
        run: npm audit --json > audit-report.json || true

      - name: Summarise the advisories
        run: node scripts/npm-audit-report.mjs audit-report.json > audit-summary.md

      - name: Apply the fixes npm can apply
        # --package-lock-only updates the lockfile and nothing else, so the
        # working tree stays reviewable: the diff is the dependency graph and
        # nothing else.
        run: npm audit fix --package-lock-only

      - name: Check whether anything changed
        id: fix
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the updated lockfile still installs and typechecks
        if: steps.fix.outputs.changed == 'true'
        run: |
          npm ci
          npm run typecheck

      - name: Open a pull request with the fixes
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # One open audit pull request at a time. The branch name carries the
          # run number so a run never pushes over an old branch.
          branch="chore/npm-audit-fixes-${GITHUB_RUN_NUMBER}"
          open=$(gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -c '^chore/npm-audit-fixes' || true)
          if [ "$open" != "0" ]; then
            echo "An audit pull request is already open. Leaving it alone."
            exit 0
          fi

          {
            echo "Automated dependency fixes from the weekly \`npm audit\` sweep."
            echo
            cat audit-summary.md
            echo
            echo "Only \`package-lock.json\` is changed. The advisory counts and the"
            echo "versions that fix them are listed above; the review is whether the"
            echo "bumped versions are safe to ship."
          } > pr-body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package-lock.json
          git commit -m "chore(deps): apply npm audit fixes"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(deps): apply npm audit fixes" \
            --body-file pr-body.md
