name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # The whole point of the 2.x dependency tree. This is a hard gate: a
        # moderate-or-worse advisory fails the build rather than a warning.
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .next/
          retention-days: 3
          if-no-files-found: ignore

  browser:
    name: Browser journey (live)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the primary journey in a real browser
        # The tests run against the live deployment, so they are skipped when it
        # is unreachable rather than failing the whole pipeline on an outage.
        env:
          FM_BROWSER: chromium
          FM_BASE_URL: ${{ vars.FM_BASE_URL }}
        run: npx playwright test --reporter=list

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore
